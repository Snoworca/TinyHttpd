plugins {
    id 'ru.vyarus.animalsniffer' version '2.0.1' apply false
}

allprojects {
    group = 'com.snoworca.tinyhttpd'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// Library modules only: tools such as :bench use JVM-only APIs and skip the API 21 check.
def libraryProjects = [':tinyhttpd-core', ':tinyhttpd-webserver', ':tinyhttpd-websocket', ':tinyhttpd-router',
                       ':tinyhttpd-session']

configure(subprojects.findAll { it.path in libraryProjects }) {
    apply plugin: 'java-library'
    apply plugin: 'ru.vyarus.animalsniffer'

    // Java 8 language level, compiled with --release so only Java 8 class library APIs resolve.
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-options']
    }

    // P0-05/P8-05: main code compiles without warnings.
    tasks.named('compileJava').configure {
        options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Werror']
    }

    javadoc {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    // Android 5.0 (API 21) is the minimum runtime: fail the build on any API that API 21 lacks.
    animalsniffer {
        sourceSets = [sourceSets.main]
    }

    dependencies {
        signature 'net.sf.androidscents.signature:android-api-level-21:5.0.1_r2@signature'

        testImplementation 'junit:junit:4.13.2'
        testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    }

    test {
        useJUnit()
    }
}

project(':tinyhttpd-core') {
    apply plugin: 'java-test-fixtures'

    // Shared test tools (RawConnection, client helpers) used by every module's tests.
    dependencies {
        testFixturesImplementation 'junit:junit:4.13.2'
        testFixturesImplementation 'com.squareup.okhttp3:okhttp:4.12.0'

        testImplementation 'org.apache.httpcomponents:httpclient:4.2.5'
        testImplementation 'org.apache.httpcomponents:httpmime:4.2.5'
    }

    // Tests tagged KnownDefect describe intended behavior that the inherited code does not have yet.
    def knownDefect = 'com.snoworca.tinyhttpd.junit.KnownDefect'

    test {
        useJUnit {
            excludeCategories knownDefect
        }
        // -Dfuzz.cases=10000 runs the full parser fuzz (P1-14); CI uses the default 1,000.
        systemProperties System.getProperties().findAll { it.key.toString().startsWith('fuzz.') }
        // TLS-02: lets the JDK speak TLS 1.0 so the test shows TinyHttpd's defaults refuse it.
        systemProperty 'java.security.properties', file('src/test/resources/tls-test.security').absolutePath
    }

    tasks.register('knownDefectTest', Test) {
        description = 'Runs tests for known defects; failures are expected until each defect is fixed.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnit {
            includeCategories knownDefect
        }
        ignoreFailures = true
    }
}

project(':tinyhttpd-webserver') {
    dependencies {
        api project(':tinyhttpd-core')
        testImplementation testFixtures(project(':tinyhttpd-core'))
    }
}

project(':tinyhttpd-websocket') {
    dependencies {
        api project(':tinyhttpd-core')
        testImplementation testFixtures(project(':tinyhttpd-core'))
    }
}

project(':tinyhttpd-router') {
    dependencies {
        api project(':tinyhttpd-core')
        testImplementation testFixtures(project(':tinyhttpd-core'))
    }
}

project(':tinyhttpd-session') {
    dependencies {
        api project(':tinyhttpd-core')
        testImplementation testFixtures(project(':tinyhttpd-core'))
    }
}

// Benchmark tool (tools/bench): not published, not checked against API 21.
project(':bench') {
    apply plugin: 'java'
    apply plugin: 'application'

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-options']
    }

    dependencies {
        implementation project(':tinyhttpd-core')
    }

    application {
        mainClass = 'com.snoworca.tinyhttpd.bench.Bench'
        applicationDefaultJvmArgs = ['-Xmx256m']
    }

    // -Dbench.engine=old|new, -Dbench.seconds, -Dbench.maxHeapDeltaKB reach the bench JVM.
    tasks.named('run').configure {
        systemProperties System.getProperties().findAll { it.key.toString().startsWith('bench.') }
    }
}
